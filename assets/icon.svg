<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#0d0d0d"/>
  <!-- Flip card sol -->
  <rect x="6" y="18" width="22" height="28" rx="4" fill="#1e1e1e"/>
  <rect x="6" y="18" width="22" height="14" rx="4" fill="#2a2a2a"/>
  <line x1="6" y1="32" x2="28" y2="32" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Flip card sag -->
  <rect x="36" y="18" width="22" height="28" rx="4" fill="#1e1e1e"/>
  <rect x="36" y="18" width="22" height="14" rx="4" fill="#2a2a2a"/>
  <line x1="36" y1="32" x2="58" y2="32" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Ayirici noktalar -->
  <circle cx="32" cy="27" r="2" fill="#5b8def"/>
  <circle cx="32" cy="37" r="2" fill="#5b8def"/>
  <!-- Sol kart T harfi -->
  <text x="17" y="30" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#5b8def" text-anchor="middle">T</text>
  <text x="17" y="43" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#3a5faa" text-anchor="middle">T</text>
  <!-- Sag kart saat rakami -->
  <text x="47" y="30" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#e0e0e0" text-anchor="middle">1</text>
  <text x="47" y="43" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#aaaaaa" text-anchor="middle">2</text>
  <!-- Alt accent cizgi -->
  <rect x="18" y="52" width="28" height="2" rx="1" fill="#5b8def" opacity="0.6"/>
</svg>
